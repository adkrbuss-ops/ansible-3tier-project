---
- name: Create config directory
  ansible.builtin.file:
    path: /opt/nginx
    state: directory
    mode: "0755"

- name: Render nginx config (reverse proxy to app tier)
  ansible.builtin.template:
    src: default.conf.j2
    dest: /opt/nginx/default.conf
    mode: "0644"

- name: Run frontend/nginx container
  community.docker.docker_container:
    name: frontend
    image: "{{ frontend_image }}:{{ image_tag }}"
    pull: true
    state: started
    recreate: true
    restart_policy: unless-stopped
    ports:
      - "{{ web_port }}:80"
    volumes:
      - /opt/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

- name: Verify site is up
  ansible.builtin.uri:
    url: "http://localhost:{{ web_port }}/"
    status_code: 200
  register: site
  retries: 10
  delay: 3
  until: site.status == 200
