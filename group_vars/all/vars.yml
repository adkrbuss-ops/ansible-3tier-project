# ---------- AWS ----------
aws_region: ap-south-1
key_name: my-ec2-keypair          # existing EC2 key pair name
project: threetier
ami_owner: "099720109477"         # Canonical
ami_name_filter: "ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*"

instances:
  - { name: threetier-jenkins, role: jenkins, type: t3.medium, sg: threetier-jenkins-sg }
  - { name: threetier-web,     role: web,     type: t3.micro,  sg: threetier-web-sg }
  - { name: threetier-app,     role: app,     type: t3.micro,  sg: threetier-app-sg }
  - { name: threetier-db,      role: db,      type: t3.small,  sg: threetier-db-sg }

# ---------- Docker images ----------
docker_hub_user: yourdockerhubuser
backend_image: "{{ docker_hub_user }}/threetier-backend"
frontend_image: "{{ docker_hub_user }}/threetier-frontend"
image_tag: latest
registry_is_private: false

# ---------- Application ----------
db_name: appdb
db_user: appuser
db_password: "{{ vault_db_password }}"
db_port: 5432
app_port: 3000
web_port: 80

# Private IPs are used for tier-to-tier traffic
db_private_ip:  "{{ hostvars[groups['role_db'][0]].private_ip_address }}"
app_private_ip: "{{ hostvars[groups['role_app'][0]].private_ip_address }}"
