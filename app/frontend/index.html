<!doctype html>
<html><head><meta charset="utf-8"><title>3-Tier App</title></head>
<body style="font-family:sans-serif;text-align:center;margin-top:15vh">
  <h1>3-Tier App on AWS EC2</h1>
  <p>Web (nginx) &rarr; App (Node.js) &rarr; DB (PostgreSQL)</p>
  <h2>Total visits: <span id="v">...</span></h2>
  <script>
    fetch('/api/visits').then(r => r.json()).then(d => v.textContent = d.visits ?? d.error);
  </script>
</body></html>
